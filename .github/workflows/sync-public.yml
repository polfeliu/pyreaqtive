name: Sync public source

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: sync-public-release
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'feliupol/pyreaqtive'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Replicate master and tags to public repository
        env:
          PUBLIC_REPO_SYNC_TOKEN: ${{ secrets.PUBLIC_REPO_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_REPO_SYNC_TOKEN"
          git config --global user.name 'Pol Feliu Cuberes'
          git config --global user.email 'plo.fc.123@gmail.com'
          git remote add public "https://x-access-token:${PUBLIC_REPO_SYNC_TOKEN}@github.com/polfeliu/pyreaqtive.git"
          git fetch public master --tags
          git push public HEAD:master
          git push public --tags

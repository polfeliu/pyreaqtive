name: Private Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux]
    container:
      image: localhost:5000/python-ci:latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    env:
      python-version: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv python install ${{ env.python-version }}
          uv sync --python ${{ env.python-version }} --extra dev --locked

      - name: Run mypy
        if: matrix.python-version == '3.10'
        run: uv run --python ${{ env.python-version }} mypy --package pyreaqtive --package tests --config-file mypy.ini

      - name: Run pylint
        if: matrix.python-version == '3.10'
        run: uv run --python ${{ env.python-version }} pylint pyreaqtive tests --rcfile=.pylintrc

      - name: Run pydocstyle
        if: matrix.python-version == '3.10'
        run: uv run --python ${{ env.python-version }} pydocstyle pyreaqtive --config=.pydocstyle.ini

      - name: Run tests with coverage
        run: uv run --python ${{ env.python-version }} pytest --cov pyreaqtive --cov-branch --cov-report term-missing --cov-fail-under=100

      - name: Build package
        if: matrix.python-version == '3.9'
        run: uv run --python ${{ env.python-version }} python -m build

      - name: Build documentation
        if: matrix.python-version == '3.8'
        run: uv run --python ${{ env.python-version }} sphinx-build -W -b html doc/source doc/build

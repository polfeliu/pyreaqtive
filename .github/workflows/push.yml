name: Pipeline

on: [ push ]

jobs:
  build:
    if: github.repository == 'polfeliu/pyreaqtive'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - python-version: '3.8'
          - python-version: '3.9'
          - python-version: '3.10'
          - python-version: '3.11'
          - python-version: '3.12'
          - python-version: '3.13'
          - python-version: '3.14'
    env:
      python-version: ${{ matrix.python-version }}
      venv: .venv
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Dependencies
        run: |
          uv python install ${{ env.python-version }}
          uv sync --python ${{ env.python-version }} --extra dev --locked

      - name: Run mypy
        if: matrix.python-version == '3.10'
        run: |
          uv run --python ${{ env.python-version }} mypy --package pyreaqtive --package tests --config-file mypy.ini

      - name: Run pylint
        if: matrix.python-version == '3.10'
        run: |
          uv run --python ${{ env.python-version }} pylint pyreaqtive tests --rcfile=.pylintrc

      - name: Run pydocstyle
        if: matrix.python-version == '3.10'
        run: |
          uv run --python ${{ env.python-version }} pydocstyle pyreaqtive --config=.pydocstyle.ini

      - name: Run Tests with coverage
        run: |
          uv run --python ${{ env.python-version }} pytest --cov pyreaqtive --cov-branch --cov-report term-missing --cov-fail-under=100

      - name: Build lib
        if: matrix.python-version == '3.9'
        run: |
          uv run --python ${{ env.python-version }} python -m build

      - name: Archive build
        if: matrix.python-version == '3.9'
        uses: actions/upload-artifact@v4
        with:
          name: wheel_build
          path: dist/*.whl

      - name: Find package
        if: matrix.python-version == '3.9'
        run: |
          cp dist/pyreaqtive-*-py3-none-any.whl pyreaqtive-0.0.0-py3-none-any.whl  

      - name: Install lib
        if: matrix.python-version == '3.9'
        run: |
          uv venv --python ${{ env.python-version }} wheel-test
          uv pip install --python wheel-test/bin/python pyreaqtive-0.0.0-py3-none-any.whl
          uv pip install --python wheel-test/bin/python PyQt5==5.15.7 pytest==7.2.1 pytest-cases==3.6.13 pytest-qt==4.2.0
          rm -rf pyreaqtive

      - name: Run Tests
        if: matrix.python-version == '3.9'
        run: |
          wheel-test/bin/python -m pytest

      - name: Build Docs
        if: matrix.python-version == '3.8'
        run: |
          uv run --python ${{ env.python-version }} sphinx-build -W -b html doc/source doc/build

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.repository == 'polfeliu/pyreaqtive' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtual environment
        run: |
          uv python install 3.9

      - name: Install Dependencies
        run: |
          uv sync --python 3.9 --extra dev --locked

      - name: Build lib
        run: |
          uv run --python 3.9 python -m build

      - name: Publish to PyPi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

name: Pipeline

on: [ push ]

jobs:
  build:
    runs-on: [self-hosted, linux]
    container:
      image: localhost:5000/python-ci:latest

    strategy:
      matrix:
        include:
          - python-version: '3.7'
            requirements: requirements-dev.txt
          - python-version: '3.8'
            requirements: requirements-dev.txt
          - python-version: '3.9'
            requirements: requirements-dev.txt
          - python-version: '3.10'
            requirements: requirements-dev.txt
          - python-version: '3.11'
            requirements: requirements-dev-modern.txt
          - python-version: '3.12'
            requirements: requirements-dev-modern.txt
          - python-version: '3.13'
            requirements: requirements-dev-modern.txt
          - python-version: '3.14'
            requirements: requirements-dev-modern.txt
    env:
      python-version: ${{ matrix.python-version }}
      requirements: ${{ matrix.requirements }}
      venv: .venv
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Dependencies
        run: |
          uv venv --python ${{ env.python-version }} ${{ env.venv }}
          uv pip install --python ${{ env.venv }}/bin/python -r ${{ env.requirements }}
          uv pip install --python ${{ env.venv }}/bin/python -e .

      - name: Run mypy
        run: |
          ${{ env.venv }}/bin/python -m mypy --package pyreaqtive --package tests --config-file mypy.ini

      - name: Run pylint
        run: |
          ${{ env.venv }}/bin/python -m pylint pyreaqtive tests --rcfile=.pylintrc

      - name: Run pydocstyle
        run: |
          ${{ env.venv }}/bin/python -m pydocstyle pyreaqtive --config=.pydocstyle.ini

      - name: Run Tests with coverage
        run: |
          ${{ env.venv }}/bin/python -m pytest --cov pyreaqtive --cov-branch --cov-report term-missing --cov-fail-under=100

      - name: Build lib
        if: matrix.python-version == '3.9'
        run: |
          ${{ env.venv }}/bin/python setup.py sdist bdist_wheel

      - name: Archive build
        if: matrix.python-version == '3.9'
        uses: actions/upload-artifact@v4
        with:
          name: wheel_build
          path: dist/*.whl

      - name: Find package
        if: matrix.python-version == '3.9'
        run: |
          cp dist/pyreaqtive-*-py3-none-any.whl pyreaqtive-0.0.0-py3-none-any.whl  

      - name: Install lib
        if: matrix.python-version == '3.9'
        run: |
          uv venv --python ${{ env.python-version }} wheel-test
          uv pip install --python wheel-test/bin/python pyreaqtive-0.0.0-py3-none-any.whl PyQt5==5.15.7 pytest==7.2.1 pytest-cases==3.6.13 pytest-qt==4.2.0
          rm -rf pyreaqtive

      - name: Run Tests
        if: matrix.python-version == '3.9'
        run: |
          wheel-test/bin/python -m pytest

      - name: Build Docs
        if: matrix.python-version == '3.8'
        run: |
          ${{ env.venv }}/bin/python -m sphinx -W -b html doc/source doc/build

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtual environment
        run: |
          uv venv --python python3.9 .venv

      - name: Install Dependencies
        run: |
          uv pip install --python .venv/bin/python -r requirements-dev.txt
          uv pip install --python .venv/bin/python -e .

      - name: Build lib
        run: |
          .venv/bin/python setup.py sdist bdist_wheel

      - name: Publish to PyPi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
